services:
  background-removal-api:
    build: .
    environment:
      RMBG_MODEL: ${RMBG_MODEL:-briaai/RMBG-2.0}
      TORCH_DEVICE: ${TORCH_DEVICE:-cuda}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      API_KEY: ${API_KEY:-}
      MCP_OWNER_KEY: ${MCP_OWNER_KEY:-}
      PUBLIC_ORIGIN: https://bgremove.etdofresh.com
      OAUTH_DB: /data/oauth.db
      HF_TOKEN: ${HF_TOKEN:-}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "993"   # render
      - "44"    # video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: 8g
    volumes:
      - rmbg-models:/models
      - rmbg-history:/app/history
      - rmbg-oauth:/data
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  rmbg-models:
  rmbg-history:
  rmbg-oauth:
